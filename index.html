    <body>
        <!-- Custom BodyStart code is injected here -->
        

        <!-- Start on a click, so the browser allows audio from the first sound. Enabled once the game code has loaded. -->
        <button id="start" disabled onclick="document.getElementById('install').remove(); this.remove(); GameMaker_Init();">Loading</button>

        <!-- On the first visit from a phone or tablet in the browser, suggest installing the game as an app, which opens full screen. -->
        <div id="install" hidden role="dialog" aria-labelledby="install-title">
            <div class="panel">
                <h2 id="install-title">Play full screen</h2>
                <p>Barkley plays best installed as an app. It opens full screen, without the browser's address bar, straight from your home screen.</p>
                <p id="install-how"></p>
                <p class="note" id="install-note" hidden></p>
                <button id="install-now" hidden>Install</button>
                <button id="install-skip">Continue in browser</button>
            </div>
        </div>
        <script>
            (() => {
                const box = document.getElementById("install");
                const app = matchMedia("(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)").matches || navigator.standalone;
                const touch = navigator.maxTouchPoints > 0 && matchMedia("(pointer: coarse)").matches;
                let seen = false;
                try { seen = localStorage.getItem("barkley.install") !== null; } catch (e) {}
                if (app || !touch || seen) return;
                try { localStorage.setItem("barkley.install", "1"); } catch (e) {}
                const $ = (id) => document.getElementById(id);
                const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
                if (ios) {
                    $("install-how").innerHTML = 'In Safari, tap <b>Share</b> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg> (in the toolbar, or under <b>&middot;&middot;&middot;</b>), then <b>Add to Home Screen</b>. Then open Barkley from your home screen.';
                    // Home-screen apps on iOS keep their own storage, apart from Safari's.
                    $("install-note").textContent = "The app keeps its own saves, separate from Safari's. To bring saves along, use Configuration \u2192 SETTINGS \u2192 Saves in both.";
                    $("install-note").hidden = false;
                } else {
                    $("install-how").innerHTML = 'Open the browser menu (<b>&#8942;</b>) and tap <b>Install app</b> or <b>Add to Home screen</b>. Then open Barkley from your home screen.';
                }
                // Chrome can show its own install dialog, but only once it decides the page qualifies, so the button appears when it does.
                addEventListener("beforeinstallprompt", (e) => {
                    if (!box.isConnected || box.hidden) return;
                    e.preventDefault();
                    $("install-now").hidden = false;
                    $("install-now").onclick = () => e.prompt().then(() => e.userChoice).then((r) => r.outcome === "accepted" && (box.hidden = true));
                });
                $("install-skip").onclick = () => (box.hidden = true);
                box.hidden = false;
            })();
        </script>
