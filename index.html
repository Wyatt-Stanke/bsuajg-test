                width: 100%;
                height: 100%;

                width: 100%;

                background: none;
                border: 0;

            .ui-btn:focus-visible,

            #start {

                inset: 0;
                z-index: 10;
                display: flex;
                flex-direction: column;

                touch-action: manipulation;
            }
            #start:focus {
                outline: none;
            }
            #start:disabled {
                cursor: default;
            }
            #start .name {
                color: var(--mute);
